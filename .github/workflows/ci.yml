# ══════════════════════════════════════════════════════════════════
# CI — the gate that did not exist
# ══════════════════════════════════════════════════════════════════
#
# Until this file, the only check on a pull request was a Vercel preview
# deploy. That is not a gate on correctness: `vite build` transpiles
# TypeScript with esbuild, which STRIPS types without checking them, so a
# build can go green over code that `tsc` would reject outright. And nothing
# anywhere ran the functions test suites — the 13,446-state timing sweep and
# the five scenario suites were local-only, which meant "all green" was a
# claim in a commit message rather than a fact about the branch.
#
# Two jobs, deliberately separate. They fail for unrelated reasons and a
# reviewer should be able to see which half broke without opening a log.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger. Added 2026-08-06 as a diagnostic, when this workflow had
  # produced zero runs despite every observable saying it should be running,
  # and push/pull_request give no feedback when they decline to schedule
  # anything. That is RESOLVED — the workflow has run and gone green
  # continuously since; the diagnosis no longer needs stating here.
  #
  # Kept because on-demand re-runs are independently useful: when a run is
  # cancelled by the concurrency rule below, or when re-checking without
  # pushing an empty commit.
  workflow_dispatch:

# For pull requests, a new push supersedes an in-flight run for the same ref.
# For pushes to main, each commit gets its own run (no cancellation) so that
# merging multiple PRs in quick succession doesn't leave CI with zero completed
# runs.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  # ── Do all the Node pins still name the same major? ─────────────
  #
  # The 2026-08-14 upgrade moved three pins in one commit because "a mismatch
  # between any two of them is worse than either value alone", and it was
  # right. Nothing then kept them together: firebase-tools checks engines
  # against firebase.json at DEPLOY time, and everything else was held by
  # whoever remembered to grep.
  #
  # Two things had already slipped by the time this job was written, and both
  # were a MISSING pin rather than a wrong one — which is why reading the files
  # that did carry a version never found them. The root package.json had no
  # `engines` at all, so Vercel took the major for the frontend AND for
  # api/seb-verify.js — the SEB proof minter — from a dashboard setting no file
  # here records. And infra/judge0/README.md told you to run the pre-exam
  # acceptance gate in a container built on the PREVIOUS major, which builds
  # functions/ and imports the compiled adapter.
  #
  # No install, no build: it reads files and compares integers, so it finishes
  # in seconds and fails with the specific line to change.
  node-pins:
    name: Node version pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-node on purpose. This job must not depend on the pin it is
      # checking, and the runner's preinstalled Node is enough to read JSON.
      - name: Every pin names the same major
        run: node scripts/check-node-pins.mjs

  # ── Frontend: lint, typecheck, and the vitest suite ─────────────
  #
  # This job used to run `tsc --noEmit` and stop, which left the largest body
  # of frontend verification in the repository — the vitest suite, 1,000-plus
  # assertions — running on developer machines only. "All green" was a claim
  # about somebody's laptop again, which is the exact failure this workflow
  # was created to end, one level up.
  frontend:
    name: Frontend lint, typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .nvmrc, not a literal. The major used to be written out here, which
      # made this the third copy of a number that has to agree with
      # firebase.json and both engines fields; node-version-file removes the
      # copy rather than checking it.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `npm ci`, and it can be, because the two things that blocked it are
      # both resolved: the root now HAS a committed package-lock.json, and
      # `xlsx` is a vendored tarball (`file:vendor/xlsx-0.20.3.tgz`) rather
      # than a direct cdn.sheetjs.com URL, so a lockfile can describe the
      # whole tree. Installs here are reproducible, and `npm audit` works.
      #
      # --ignore-scripts skips the root postinstall, which curls face-api
      # model weights from raw.githubusercontent.com. Those weights are a
      # RUNTIME asset — nothing in this job touches them — so fetching them
      # here buys nothing and puts a third-party host on the critical path of
      # every CI run.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ── The repo carries TWO lockfiles, and both have to agree ──────
      #
      # package-lock.json is what CI installs from. pnpm-lock.yaml is what
      # VERCEL installs from — it auto-detects pnpm from the file's presence,
      # and runs with --frozen-lockfile. So a dependency change that updates
      # only the npm lockfile passes every check here and then fails the
      # deploy with ERR_PNPM_OUTDATED_LOCKFILE.
      #
      # That is not hypothetical; it is how this step came to exist. CI was
      # green on all three jobs while the Vercel deployment for the same
      # commit was red, which is the worst version of the failure: the
      # signal everyone reads said the branch was fine.
      #
      # --lockfile-only resolves and compares without linking anything, so
      # this costs seconds and cannot disturb the npm tree installed above.
      # Fix a failure with `pnpm install --lockfile-only` and commit the
      # result — never by deleting the lockfile.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: pnpm-lock.yaml agrees with package.json
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts

      # Errors only (--quiet). The warning count is real debt and is meant to
      # be read by a person running `npm run lint`; it must not fail a deploy
      # while it is being worked down. When it reaches zero, drop --quiet and
      # add --max-warnings 0 here — that is the moment this becomes a ratchet.
      - name: eslint
        run: npm run lint:errors

      # `strict: true`, checked against the dependency the app actually ships.
      - name: tsc --noEmit
        run: npm run typecheck

      - name: vitest
        run: npm test

  # ── Functions: build, then the seven suites ─────────────────────
  functions:
    name: Functions build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      # .nvmrc, which the node-pins job asserts equals functions/package.json
      # engines.node and firebase.json's runtime — the deployed runtime is
      # nodejs24, and a suite that passes on a different major is not evidence
      # about production.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The rules suite runs the real firestore.rules AND storage.rules
      # against the Firestore + Storage emulators, which are JARs.
      # ubuntu-latest ships a JDK, but relying on that implicitly means a
      # runner image change breaks the security suite with an error that looks
      # nothing like its cause.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ~60 MB, refetched on every run otherwise. Keyed on the CLI version
      # because that is what decides which emulator build is pulled.
      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: firebase-emulators-

      # `npm ci` here, because functions/ DOES have a lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The timing property sweep, freeze, e2e, groups, four audit probe
      # rounds, grading, manual grading, risk, the two judge suites, and then
      # the emulator-backed rules, concurrency and bulk-delete suites.
      #
      # The scenario suites load the COMPILED handlers from lib/
      # (`require('../lib/index.js')`) rather than re-implementing their
      # arithmetic, which is why the build step above is a prerequisite and
      # not a duplicate of it.
      #
      # The last three are the odd ones out, and deliberately so: they need the
      # emulator rather than the in-memory fake the rest use. The rules
      # suite is the only thing that executes firestore.rules — before it, a
      # rule could be deleted outright and every suite stayed green. The
      # concurrency suite is the only thing that sees a real read set —
      # before it, removing startExam's transactional guard let eight
      # duplicate attempts through while B-13 and B-14 still passed.
      - name: Test
        run: npm test
