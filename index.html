
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
           anything other than 0. Without it the exam's bottom action bar sits
           underneath the iPhone home indicator, where the last few pixels of
           "Next" and "Submit" cannot be tapped. -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Exam Forge 1.0</title>
      <meta name="description" content="This platform offers a secure and streamlined login experience for Web Owners, ensuring strict access control and immediate updates for brand identity." />
      <meta name="robots" content="noindex, nofollow" />

      <!-- Webfonts.
           styles/fonts.css has always declared `--font-sans: 'Inter', …` and
           pointed here for the @font-face, noting that an @import inside a
           bundled stylesheet is render-blocking and serialised. The link it
           described was not actually present, so every surface has been
           rendering in the system fallback. It is here now, plus one display
           face used for page titles and large figures on the student console.

           preconnect first: it opens the TLS connection to the font host in
           parallel with parsing the rest of this document, which is the whole
           reason the two hosts are named separately from the stylesheet link.
           display=swap so text paints immediately in the fallback rather than
           waiting on the download — an exam candidate must never be looking at
           an invisible timer. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
