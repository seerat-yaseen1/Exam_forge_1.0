# ═══════════════════════════════════════════════════════════════════
# JUDGE0 — self-hosted execution cluster for Exam Forge coding items
#
# Read infra/judge0/README.md before changing anything here. The two
# properties this file exists to guarantee:
#
#   1. CANDIDATE CODE CANNOT REACH THE NETWORK. The workers sit on an
#      internal-only Docker network with no gateway, and every submission
#      additionally carries enable_network:false. Belt and braces, because
#      a program that could reach the network could exfiltrate the paper.
#
#   2. THE API IS NEVER PUBLIC. It binds ONE named internal address on a
#      VM that has no external IP, and is reached only through the VPC
#      connector from Cloud Functions. Judge0 runs arbitrary code by
#      design; an instance anyone can reach is a cryptominer with extra
#      steps, and this has happened to public Judge0 deployments
#      repeatedly. Note that "not public" is not the same as "loopback" —
#      see the ports: entry below for why that difference matters.
#
# Versions are PINNED. Judge0's numeric language ids change between
# releases, and JUDGE0_LANGUAGE_IDS in functions/src/judge0Adapter.ts is
# pinned to the tag below. Changing it without re-running the language
# check runs submissions in the wrong language.
# ═══════════════════════════════════════════════════════════════════

x-judge0-image: &judge0-image judge0/judge0:1.13.1

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ── API ─────────────────────────────────────────────────────────
  server:
    image: *judge0-image
    command: ["./scripts/server"]
    restart: always
    # INTERNAL INTERFACE ONLY, never 0.0.0.0.
    #
    # This was 127.0.0.1 and that was wrong: a Serverless VPC connector does
    # NOT arrive on loopback. It arrives from the connector's own range on the
    # host's internal address, so a loopback publish refuses the connection
    # while every other layer — firewall, connector, secret, base URL — looks
    # correct. The symptom is judge_unavailable against a cluster that answers
    # curl perfectly well from inside the box.
    #
    # Diagnostic, from the VM:
    #   curl -o /dev/null -w '%{http_code}' http://10.128.0.2:2358/about  -> 401
    #   curl -o /dev/null -w '%{http_code}' http://127.0.0.1:2358/about   -> 000
    # 401 is the correct answer here; it means the API is up and demanding its
    # token.
    #
    # The address is hardcoded rather than 0.0.0.0 on purpose. 0.0.0.0 would
    # publish on every interface, and this VM is one --address flag away from
    # having a public one. Hardcoding fails CLOSED: if the VM is ever recreated
    # with a different internal IP, nothing listens and the judge degrades to
    # manual review, rather than the port quietly opening to the world.
    # JUDGE0_BASE_URL in functions/.env.<project> carries the same address, so
    # the two break together and are fixed together.
    ports:
      - "10.128.0.2:2358:2358"
    # The server and workers need the Postgres and Redis credentials to CONNECT,
    # not just to be started alongside them. Judge0 reads its configuration from
    # both the mounted judge0.conf and the process environment; connection
    # settings live in .env.judge0 beside the secrets they belong with, so they
    # are never committed.
    env_file: ./.env.judge0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    networks:
      - judge0-internal
      - judge0-egress
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # LIVENESS, NOT AUTHORIZATION. No -f and no token: this asks whether Puma
      # is up and routing, and a 401 answers that just as well as a 200 does.
      # curl exits 0 for any complete HTTP response, so the check fails only
      # when nothing is listening — which is the one thing a restart fixes and
      # therefore the only thing worth restarting on.
      #
      # It carried the token briefly and that was a mistake twice over. It put
      # a secret in a probe that runs every 30 seconds and logs its output, and
      # it made the probe fail whenever the expansion did not reach curl —
      # reporting a working server as broken, which is the failure it was
      # introduced to fix. Whether authentication actually works is V-02's job
      # in verify.mjs, where a wrong answer is a test failure rather than a
      # container Compose keeps restarting.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:2358/system_info"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first boot runs database migrations and inserts every language
      # row, which takes appreciably longer than a restart.
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging: *default-logging

  # ── Workers — where candidate code actually runs ────────────────
  #
  # privileged is required: isolate needs cgroup and namespace control to
  # enforce the CPU, memory and process limits that stop a submission
  # taking the machine down. It is also why workers get their own host
  # and their own network with no route out.
  workers:
    image: *judge0-image
    command: ["./scripts/workers"]
    restart: always
    privileged: true
    # The server and workers need the Postgres and Redis credentials to CONNECT,
    # not just to be started alongside them. Judge0 reads its configuration from
    # both the mounted judge0.conf and the process environment; connection
    # settings live in .env.judge0 beside the secrets they belong with, so they
    # are never committed.
    env_file: ./.env.judge0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    networks:
      # NO judge0-egress. Workers talk to Postgres and Redis and nothing
      # else — this is the isolation, not a convenience.
      - judge0-internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Scale with `docker compose up -d --scale workers=N`. N is the real
    # concurrency ceiling of the whole platform; see the sizing note in
    # the README before raising it.
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "2"
          memory: 4G
    logging: *default-logging

  # ── Submission store ────────────────────────────────────────────
  db:
    image: postgres:16.4-alpine
    restart: always
    env_file: ./.env.judge0
    volumes:
      - judge0-db:/var/lib/postgresql/data
    networks:
      - judge0-internal
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Queue ───────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    restart: always
    env_file: ./.env.judge0
    # sh, NOT bash: this is an Alpine image and bash does not exist in it, so a
    # bash -c command line kills the container on start and every dependent
    # service then fails on the healthcheck rather than on the real cause.
    #
    # A shell is needed at all because the password has to be read from the
    # container's environment. Compose's own ${VAR} interpolation reads .env,
    # not .env.judge0, so it would expand to an empty string here and start an
    # UNAUTHENTICATED Redis — the escaped $$ defers expansion to the container,
    # where env_file has actually been applied.
    #
    # exec so redis-server becomes PID 1 and receives stop signals directly.
    command:
      [
        "sh", "-c",
        'exec redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    networks:
      - judge0-internal
    healthcheck:
      # Quoted: a base64 password contains / and + and would otherwise split.
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

networks:
  # internal: true removes the gateway entirely. A container on this
  # network has no route off the host — not a firewall rule that can be
  # relaxed, an absent route.
  judge0-internal:
    internal: true
  # The API alone needs outbound reachability for nothing today; the
  # network exists so that adding (say) object storage for submission
  # archives does not tempt anyone to put the workers on it.
  judge0-egress: {}

volumes:
  judge0-db:
