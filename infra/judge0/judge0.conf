# ═══════════════════════════════════════════════════════════════════
# JUDGE0 CONFIGURATION — Exam Forge
#
# Secrets are NOT in this file. Postgres and Redis credentials come from
# .env.judge0 (git-ignored, see README); this file holds only settings
# that are safe to read.
#
# THE MAX_* CEILINGS BELOW MUST NOT BE LOWER THAN MAX_LIMITS IN
# functions/src/judgeCore.ts. Judge0 REJECTS a submission that exceeds a
# server ceiling — it does not clamp it — so a mismatch turns into a
# rejected submission, which the adapter reports as unavailable and the
# sweep retries forever. The platform already clamps author input to
# MAX_LIMITS before it gets here; these values are the backstop, and they
# are set slightly above it so the clamp is the thing that binds.
# ═══════════════════════════════════════════════════════════════════

# ── Authentication ────────────────────────────────────────────────
# Every request must carry X-Auth-Token. Set AUTHN_TOKEN in .env.judge0.
# An unauthenticated Judge0 is a public code-execution service.
AUTHN_HEADER=X-Auth-Token
AUTHZ_HEADER=X-Auth-User

# Administrative endpoints (workers, statistics, config) require the
# stronger token and are not used by the platform at all.
DISABLE_IMPLICIT_BASE64_ENCODING=false

# ── Networking ────────────────────────────────────────────────────
# TWO SETTINGS, AND THEY DO DIFFERENT JOBS. Getting this wrong is the
# reason CVE-2024-29021 was exploitable on default installs.
#
#   ENABLE_NETWORK        the DEFAULT applied when a submission omits
#                         the `enable_network` field.
#   ALLOW_ENABLE_NETWORK  the CEILING — whether the API will honour a
#                         submission that asks for network at all.
#
# Only the second is a control. Absent or empty is treated as
# permissive, so a caller sending `enable_network: true` gets network no
# matter what the default says. The adapter sends false explicitly
# (judge0Adapter.ts), but a submission that reaches the network can
# exfiltrate the paper, so this must not depend on the caller being
# correct.
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# ── Resource ceilings ─────────────────────────────────────────────
# Mirror of MAX_LIMITS (judgeCore.ts), with headroom.
#   cpuMs      15_000  -> 15s   ceiling 20
#   wallMs     30_000  -> 30s   ceiling 40
#   memoryKb   1048576 -> 1GB   ceiling 1.5GB
#   outputKb   4096    -> 4MB   ceiling 8MB
#   processes  128            ceiling 256
MAX_CPU_TIME_LIMIT=20
MAX_CPU_EXTRA_TIME=2
MAX_WALL_TIME_LIMIT=40
MAX_MEMORY_LIMIT=1572864
MAX_STACK_LIMIT=131072
MAX_MAX_PROCESSES_AND_OR_THREADS=256
MAX_MAX_FILE_SIZE=8192

# Defaults, used only if a submission omits a field. The adapter always
# sends every field, so these should never bind.
CPU_TIME_LIMIT=2
CPU_EXTRA_TIME=0.5
WALL_TIME_LIMIT=5
MEMORY_LIMIT=262144
MAX_FILE_SIZE=256
NUMBER_OF_RUNS=1

# Per-process limits ON: without them a submission can spawn threads that
# each get the full CPU and memory budget, defeating the cap.
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

# ── Queue and workers ─────────────────────────────────────────────
# Submissions are created with wait=false and polled, so the synchronous
# path is disabled outright — leaving it available invites a future caller
# to hold a web worker for the length of a run.
ENABLE_WAIT_RESULT=false
INTERVAL=0.1
COUNT=1
MAX_QUEUE_SIZE=2000

# ── Submission retention ──────────────────────────────────────────
# Candidate source code is personal data and the platform has its own
# erasure machinery; Judge0 must not become a second, unmanaged copy of
# it. Submissions are purged aggressively — the authoritative record of
# what a candidate wrote is the attempt document, and the verdict lives
# in attemptVerdicts.
MAINTENANCE_MODE=false
ENABLE_SUBMISSION_DELETE=true

# ── Batch ─────────────────────────────────────────────────────────
# One paper's test suite is submitted as a batch; 20 is comfortably above
# the largest suite an author is likely to write.
MAX_SUBMISSION_BATCH_SIZE=20

# ── Callbacks ─────────────────────────────────────────────────────
# Disabled. The platform polls; accepting callbacks would mean exposing an
# endpoint to the judge network, which is the direction of trust we spend
# this whole file avoiding.
CALLBACKS_MAX_TRIES=0
CALLBACKS_TIMEOUT=1
